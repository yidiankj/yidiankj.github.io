<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致最爱的你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100vw;
            height: 100vh;
        }

        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
            overflow: hidden;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
        }

        .scene-1 {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 90px solid #ff5252;
            z-index: 3;
            transition: transform 0.8s ease;
        }

        .envelope.open::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope::after {
            content: '💌';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            z-index: 2;
        }

        .heart-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            z-index: 4;
            transition: opacity 0.5s;
        }

        .envelope.open .heart-seal {
            opacity: 0;
        }

        .click-hint {
            color: white;
            font-size: 16px;
            margin-top: 25px;
            opacity: 0.8;
            animation: pulse 2s infinite;
            padding: 0 20px;
            text-align: center;
        }

        .scene-2 {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .letter {
            width: 90%;
            max-width: 600px;
            max-height: 75vh;
            background: white;
            padding: 30px 35px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow-y: auto;
            animation: slideIn 1s ease-out;
            border-radius: 8px;
        }

        .letter::-webkit-scrollbar {
            width: 6px;
        }

        .letter::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .letter::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 3px;
        }

        .letter::-webkit-scrollbar-thumb:hover {
            background: #ee5a6f;
        }

        .letter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: repeating-linear-gradient(
                90deg,
                #ff6b6b,
                #ff6b6b 20px,
                transparent 20px,
                transparent 40px
            );
            border-radius: 8px 8px 0 0;
        }

        .letter-content {
            line-height: 1.9;
            color: #333;
            font-size: 20px;
        }

        .letter-heading {
            font-size: 32px;
            color: #ff6b6b;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
        }

        .letter-signature {
            text-align: right;
            margin-top: 40px;
            font-size: 20px;
            color: #ff6b6b;
        }

        .continue-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .continue-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .continue-btn:active {
            transform: translateY(0);
        }

        .scene-3 {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 60px 15px 100px;
            overflow-y: auto;
        }

        .gallery-title {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #333;
            font-size: 26px;
            font-weight: bold;
            padding: 0 20px;
        }

        .photo-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
        }

        .photo-frame {
            width: 160px;
            height: 200px;
            background: white;
            padding: 12px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
            transform: rotate(0deg);
            transition: transform 0.5s;
            animation: photoAppear 0.8s ease-out backwards;
            border-radius: 8px;
        }

        .photo-frame:nth-child(2) { animation-delay: 0.2s; }
        .photo-frame:nth-child(3) { animation-delay: 0.4s; }
        .photo-frame:nth-child(4) { animation-delay: 0.6s; }

        .photo-frame:hover {
            transform: scale(1.08) rotate(3deg);
            z-index: 10;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            border-radius: 5px;
        }

        .photo-caption {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .scene-4 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .hearts-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .big-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            animation: floatUp 4s ease-in infinite;
            opacity: 0;
        }

        .love-text {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 2s ease-out;
            padding: 0 20px;
        }

        .scene-5 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .final-message {
            text-align: center;
            color: white;
            animation: zoomIn 1.5s ease-out;
            padding: 20px;
            transition: opacity 1s ease-out;
        }

        .final-message.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .final-message h1 {
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            animation: textGlow 2s ease-in-out infinite alternate;
            line-height: 1.3;
        }

        .final-message p {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .yes-btn {
            padding: 15px 50px;
            font-size: 22px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(255, 107, 107, 0.5);
            animation: pulse 2s infinite;
            margin: 15px;
        }

        .yes-btn:hover {
            transform: scale(1.08);
        }

        .yes-btn:active {
            transform: scale(1);
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explode 1.5s ease-out infinite;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }

        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            animation: rotateMusic 3s linear infinite;
        }

        .music-control.paused {
            animation-play-state: paused;
            opacity: 0.6;
        }

        .music-control.hidden {
            display: none;
        }

        @keyframes rotateMusic {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            10% { transform: translate(-50%, -50%) scale(1.1); }
            20% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.15); }
            40%, 100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes photoAppear {
            from {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes textGlow {
            from {
                text-shadow: 0 4px 20px rgba(255, 255, 255, 0.5);
            }
            to {
                text-shadow: 0 4px 40px rgba(255, 255, 255, 1), 0 0 60px rgba(255, 107, 107, 0.8);
            }
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        @keyframes roseBloom {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        @keyframes petalFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes bgPulse {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.15);
            }
        }

        .rose-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rose-svg {
            width: 300px;
            height: 350px;
            animation: roseBloom 3s ease-out forwards;
        }

        .rose-message {
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: fadeIn 2s ease-out 2s forwards;
            text-align: center;
            white-space: nowrap;
            margin-top: -120px;
            pointer-events: none;
        }

        .rose-stem {
            fill: none;
            stroke: #2d5016;
            stroke-width: 4;
        }

        .rose-leaf {
            fill: #4a7c23;
        }

        .rose-petal {
            fill: #e91e63;
            opacity: 0.9;
        }

        .rose-petal-light {
            fill: #f06292;
            opacity: 0.8;
        }

        .rose-petal-dark {
            fill: #c2185b;
            opacity: 0.95;
        }

        .rose-center {
            fill: #880e4f;
        }

        .falling-petal {
            position: fixed;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #e91e63, #f06292);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            z-index: 1999;
        }

        @media (max-width: 480px) {
            .envelope {
                width: 240px;
                height: 150px;
            }

            .envelope::before {
                border-left: 120px solid transparent;
                border-right: 120px solid transparent;
                border-top: 75px solid #ff5252;
            }

            .envelope::after {
                font-size: 40px;
            }

            .heart-seal {
                font-size: 28px;
            }

            .letter {
                width: 92%;
                padding: 25px;
            }

            .letter-content {
                font-size: 18px;
                line-height: 1.8;
            }

            .letter-heading {
                font-size: 24px;
            }

            .photo-frame {
                width: 140px;
                height: 170px;
            }

            .photo-placeholder {
                font-size: 50px;
            }

            .big-heart {
                font-size: 80px;
            }

            .love-text {
                font-size: 22px;
            }

            .final-message h1 {
                font-size: 26px;
            }

            .final-message p {
                font-size: 16px;
            }

            .yes-btn {
                padding: 12px 35px;
                font-size: 18px;
            }

            .rose-svg {
                width: 240px;
                height: 280px;
            }

            .rose-message {
                font-size: 24px;
            }
        }

        @media (max-height: 600px) {
            .letter {
                height: 75vh;
            }

            .big-heart {
                font-size: 80px;
            }

            .love-text {
                top: 10%;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="music-control" id="musicControl" onclick="toggleMusic()">🎵</div>
    <audio id="bgMusic" loop>
        <source src="http://m10.music.126.net/20260604135101/9365bc4780dcb0014f34abc97a063559/yyaac/obj/wonDkMOGw6XDiTHCmMOi/3322975048/92f8/00ce/d920/640b84cd867fd5bdbe9c5ee18400443b.m4a?vuutv=DexzzELxc2DNfF25QMTj39CntmKQhmIirBCZXZPslsDBpvVzvSzV/xB7gz4BUy6MFlKCieLZya0Rnqd9hbmyh6z/vDKVWLhdtx+/w1tKZSL4nS219GXt07LHkZsKtRPQ/O2GKN+SetAWrLkahHj9/zmwsv4/dGs/rYTWJEywZAmL26rBx+qwZPzxcv/AslR1sqPkXvtYwJAdKCiNnD9D2o/S7H47HizUH/BO5sZJLwerkRa64pwC9OAqg5egyDGp+1Y7pIQi/JET+9sS+vmIoaS4Y4Os2uxmQeGxp93mbdm5C5JUA+fQOi0HpkPYAw460GLu/SFhFVmYOXLxSbRIsRP7y728RjhGXp3USimjtU6wrPT5dVvpk9bMzhXdig8H&cdntag=bWFyaz1vc193ZWIscXVhbGl0eV9zdGFuZGFyZA==" type="audio/mp4">
    </audio>

    <div class="scene scene-1 active" id="scene1">
        <div class="envelope" id="envelope" onclick="openEnvelope()">
            <div class="heart-seal">❤️</div>
        </div>
        <p class="click-hint">点击信封，开启这份心意</p>
    </div>

    <div class="scene scene-2" id="scene2">
        <div class="letter">
            <div class="letter-content">
                <div class="letter-heading">💕 致我最爱的你 💕</div>
                <p>亲爱的：</p>
                <br>
                <p>从遇见你的那一刻起，我的世界变得如此不同。</p>
                <br>
                <p>你的笑容如春日暖阳，温暖了我所有的阴霾；你的眼睛如星辰大海，让我沉醉其中无法自拔。</p>
                <br>
                <p>每一天能与你相遇，都是我生命中最美好的礼物。我想牵着你的手，走过每一个春夏秋冬，看遍世间所有的美好。</p>
                <br>
                <p>谢谢你出现在我的生命里，让平凡的日子闪闪发光。</p>
                <br>
                <div class="letter-signature">
                    爱你的<br>
                    💖
                </div>
                <button class="continue-btn" onclick="nextScene(2)">继续</button>
            </div>
        </div>
    </div>

    <div class="scene scene-3" id="scene3">
        <h2 class="gallery-title">✨ 我们的美好瞬间 ✨</h2>
        <div class="photo-container">
            <div class="photo-frame">
                <div class="photo-placeholder">🌸</div>
                <div class="photo-caption">初次相遇</div>
            </div>
            <div class="photo-frame">
                <div class="photo-placeholder">🌺</div>
                <div class="photo-caption">甜蜜时光</div>
            </div>
            <div class="photo-frame">
                <div class="photo-placeholder">💐</div>
                <div class="photo-caption">浪漫时刻</div>
            </div>
            <div class="photo-frame">
                <div class="photo-placeholder">🌻</div>
                <div class="photo-caption">幸福永远</div>
            </div>
        </div>
        <button class="continue-btn" onclick="nextScene(3)">继续</button>
    </div>

    <div class="scene scene-4" id="scene4">
        <div class="hearts-container">
            <div class="love-text">❤️ 你是我的全世界 ❤️</div>
            <div class="big-heart">💖</div>
        </div>
        <button class="continue-btn" style="position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);" onclick="nextScene(4)">最后的话</button>
    </div>

    <div class="scene scene-5" id="scene5">
        <div class="final-message" id="finalMessage">
            <h1>💍 做我一生挚爱好吗？ 💍</h1>
            <p>愿与你携手白头，共度余生</p>
            <button class="yes-btn" id="yesBtn" onclick="celebrate()">我愿意 💕</button>
        </div>
    </div>

    <script>
        let currentScene = 1;
        let musicPlaying = false;
        let shouldPlayMusic = true;
        const music = document.getElementById('bgMusic');
        const musicControl = document.getElementById('musicControl');

        window.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (musicPlaying) {
                    music.pause();
                    musicControl.classList.add('paused');
                    musicControl.textContent = '🔇';
                }
            } else {
                if (musicPlaying && shouldPlayMusic) {
                    music.play().catch(e => console.log('Music play failed:', e));
                    musicControl.classList.remove('paused');
                    musicControl.textContent = '🎵';
                }
            }
        });

        function toggleMusic() {
            if (musicPlaying) {
                music.pause();
                musicControl.classList.add('paused');
                musicControl.textContent = '🔇';
                shouldPlayMusic = false;
            } else {
                music.play().catch(e => console.log('Music play failed:', e));
                musicControl.classList.remove('paused');
                musicControl.textContent = '🎵';
                shouldPlayMusic = true;
            }
            musicPlaying = !musicPlaying;
        }

        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
            if (!musicPlaying) {
                toggleMusic();
            }
            setTimeout(() => {
                nextScene(1);
            }, 1000);
        }

        function nextScene(sceneNum) {
            document.getElementById(`scene${sceneNum}`).classList.remove('active');
            currentScene = sceneNum + 1;
            setTimeout(() => {
                document.getElementById(`scene${currentScene}`).classList.add('active');
                if (currentScene === 4) {
                    startFloatingHearts();
                }
            }, 500);
        }

        function startFloatingHearts() {
            const container = document.querySelector('.hearts-container');
            const hearts = ['💕', '💖', '💗', '💓', '💞', '❤️'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (3 + Math.random() * 2) + 's';
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 300);
        }

        function celebrate() {
            music.pause();
            music.currentTime = 0;
            musicPlaying = false;
            shouldPlayMusic = false;
            musicControl.classList.add('hidden');
            
            document.getElementById('finalMessage').classList.add('hidden');
            
            setTimeout(() => {
                document.getElementById('finalMessage').style.display = 'none';
            }, 1000);
            
            createRose();
            createFireworks();
            createParticles();
            
            document.body.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
            document.body.style.animation = 'bgPulse 2s ease-in-out infinite';
            
            createFallingPetals();
        }

        function createRose() {
            const roseContainer = document.createElement('div');
            roseContainer.className = 'rose-container';
            roseContainer.innerHTML = `
                <div class="rose-message">💕 谢谢你答应我 💕</div>
                <svg class="rose-svg" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
                    <path class="rose-stem" d="M100 350 Q95 300 100 250 Q105 200 100 150"/>
                    <ellipse class="rose-leaf" cx="70" cy="250" rx="25" ry="15" transform="rotate(-30 70 250)"/>
                    <ellipse class="rose-leaf" cx="130" cy="300" rx="25" ry="15" transform="rotate(30 130 300)"/>

                    <ellipse class="rose-petal-dark" cx="100" cy="130" rx="30" ry="40"/>
                    <ellipse class="rose-petal" cx="100" cy="135" rx="27" ry="35"/>
                    <ellipse class="rose-petal-light" cx="100" cy="138" rx="24" ry="30"/>
                    
                    <ellipse class="rose-petal-dark" cx="70" cy="120" rx="20" ry="35" transform="rotate(-45 70 120)"/>
                    <ellipse class="rose-petal" cx="75" cy="125" rx="17" ry="30" transform="rotate(-40 75 125)"/>
                    
                    <ellipse class="rose-petal-dark" cx="130" cy="120" rx="20" ry="35" transform="rotate(45 130 120)"/>
                    <ellipse class="rose-petal" cx="125" cy="125" rx="17" ry="30" transform="rotate(40 125 125)"/>

                    <circle class="rose-center" cx="100" cy="125" r="12"/>

            `;
            document.body.appendChild(roseContainer);
        }

        function createFallingPetals() {
            const colors = ['#e91e63', '#f06292', '#ec407a', '#f48fb1'];
            
            setInterval(() => {
                for (let i = 0; i < 3; i++) {
                    const petal = document.createElement('div');
                    petal.className = 'falling-petal';
                    petal.style.left = Math.random() * 100 + '%';
                    petal.style.top = '-20px';
                    petal.style.background = `linear-gradient(135deg, ${colors[Math.floor(Math.random() * colors.length)]}, ${colors[Math.floor(Math.random() * colors.length)]})`;
                    petal.style.animation = `petalFall ${3 + Math.random() * 2}s linear forwards`;
                    petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                    document.body.appendChild(petal);
                    
                    setTimeout(() => {
                        petal.remove();
                    }, 5000);
                }
            }, 500);
        }

        function createFireworks() {
            const colors = ['#ff6b6b', '#ee5a6f', '#ff9a9e', '#fecfef', '#a8edea', '#fed6e3'];
            
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
                    firework.style.setProperty('--ty', (Math.random() * 200 - 100) + 'px');
                    document.getElementById('scene5').appendChild(firework);
                    
                    setTimeout(() => {
                        firework.remove();
                    }, 1500);
                }, i * 300);
            }
            
            setInterval(() => {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = Math.random() * 100 + '%';
                firework.style.top = Math.random() * 100 + '%';
                firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                firework.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
                firework.style.setProperty('--ty', (Math.random() * 200 - 100) + 'px');
                document.getElementById('scene5').appendChild(firework);
                
                setTimeout(() => {
                    firework.remove();
                }, 1500);
            }, 500);
        }

        function createParticles() {
            setInterval(() => {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 10 + 5) + 'px';
                particle.style.height = particle.style.width;
                document.getElementById('scene5').appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 2000);
            }, 100);
        }
    </script>
