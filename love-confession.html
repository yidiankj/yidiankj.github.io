<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪漫星空</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a4e 50%, #2d1b4e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 星空背景 */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            animation: twinkle 1.5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 月亮 */
        .moon {
            position: absolute;
            top: 80px;
            right: 15%;
            width: 120px;
            height: 120px;
            background: #f4e4ba;
            border-radius: 50%;
            box-shadow: 0 0 60px #f4e4ba, 0 0 100px #f4e4ba80;
            animation: moonGlow 3s infinite alternate;
        }

        .moon::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 25px;
            width: 25px;
            height: 25px;
            background: #e8d4a8;
            border-radius: 50%;
        }

        .moon::after {
            content: '';
            position: absolute;
            top: 50px;
            left: 60px;
            width: 15px;
            height: 15px;
            background: #e8d4a8;
            border-radius: 50%;
        }

        @keyframes moonGlow {
            0% { box-shadow: 0 0 60px #f4e4ba, 0 0 100px #f4e4ba80; }
            100% { box-shadow: 0 0 80px #f4e4ba, 0 0 120px #f4e4ba90; }
        }

        /* 表白文字 */
        .confession-text {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
        }

        .confession-text h1 {
            font-size: 32px;
            color: #ff4757;
            text-shadow: 3px 3px 0 #c44569, 6px 6px 0 #00000040;
            animation: textGlow 2s infinite alternate;
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 15px;
            height: 35px;
            background: #ff4757;
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 10px #ff4757, 0 0 20px #ff4757, 0 0 30px #ff4757; }
            100% { text-shadow: 0 0 20px #ff4757, 0 0 30px #ff4757, 0 0 40px #ff4757, 0 0 50px #ff4757; }
        }

        /* 云朵 */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            opacity: 0.2;
            animation: cloudMove 30s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }

        .cloud-1 {
            width: 100px;
            height: 40px;
            top: 100px;
            left: -100px;
        }

        .cloud-1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 15px;
        }

        .cloud-1::after {
            width: 40px;
            height: 40px;
            top: -15px;
            left: 45px;
        }

        .cloud-2 {
            width: 80px;
            height: 30px;
            top: 150px;
            left: -80px;
            animation-delay: -15s;
        }

        .cloud-2::before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 10px;
        }

        .cloud-2::after {
            width: 30px;
            height: 30px;
            top: -10px;
            left: 35px;
        }

        .cloud-3 {
            width: 120px;
            height: 50px;
            top: 200px;
            left: -120px;
            animation-delay: -10s;
        }

        .cloud-3::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }

        .cloud-3::after {
            width: 45px;
            height: 45px;
            top: -20px;
            left: 55px;
        }

        @keyframes cloudMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        /* 流星 */
        .shooting-star {
            position: absolute;
            width: 150px;
            height: 3px;
            background: linear-gradient(to right, #fff, transparent);
            border-radius: 2px;
            animation: shoot 4s linear forwards;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0) rotate(-35deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translateX(-500px) translateY(500px) rotate(-35deg);
                opacity: 0;
            }
        }

        /* 小星星装饰 */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- 星空 -->
        <div class="stars" id="stars"></div>

        <!-- 月亮 -->
        <div class="moon"></div>

        <!-- 云朵 -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>

        <!-- 流星容器 -->
        <div id="shooting-stars-container"></div>

        <!-- 表白文字 -->
        <div class="confession-text">
            <h1><span id="typewriter"></span><span class="cursor"></span></h1>
        </div>

        <!-- 装饰小星星 -->
        <div class="sparkle" style="top: 150px; left: 30%;"></div>
        <div class="sparkle" style="top: 200px; left: 60%;"></div>
        <div class="sparkle" style="top: 250px; left: 45%;"></div>
        <div class="sparkle" style="top: 100px; left: 75%;"></div>
    </div>

    <script>
        // 生成星星
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 300; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 1.5 + 's';
                star.style.opacity = Math.random() * 0.7 + 0.3;
                starsContainer.appendChild(star);
            }
        }

        // 生成流星
        function createShootingStar() {
            const container = document.getElementById('shooting-stars-container');
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.top = Math.random() * 30 + 10 + '%';
            shootingStar.style.right = -150 + 'px';
            shootingStar.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(shootingStar);

            // 动画结束后移除
            setTimeout(() => {
                shootingStar.remove();
            }, 4000);
        }

        // 打字效果
        function typeWriter() {
            const text = '浪漫星空';
            const element = document.getElementById('typewriter');
            let index = 0;

            function type() {
                if (index < text.length) {
                    element.textContent += text.charAt(index);
                    index++;
                    setTimeout(type, 300);
                }
            }

            // 延迟 1 秒后开始打字
            setTimeout(type, 1000);
        }

        // 初始化
        window.onload = function() {
            createStars();
            typeWriter();
            
            // 每 3-6 秒生成一个流星
            setInterval(() => {
                setTimeout(createShootingStar, Math.random() * 3000);
            }, 3000);
        };
    </script>
</body>
</html>
